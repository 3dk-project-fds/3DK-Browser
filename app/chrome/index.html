<!DOCTYPE html>
<!-- 3DK Browser — Chrome-Leiste (Topbar 1:1 aus 3dk-search.html: 60px, Blur, Logo, Kategorien) -->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: https:; font-src 'self' file:; connect-src 'self' file:;">
<title>3DK Browser</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="theme.css">
<link rel="icon" href="logo-256.png" type="image/png">
<style>
:root {
  --chrome-bg: #060608;
  --bg:        #0D0D0D;
  --bg-card:   #141414;
  --bg-hover:  #181818;
  --text:      #EDEDED;
  --muted:     #8A8A8A;
  --accent:    #E8621A;
  --accent-lo: rgba(232,98,26,.12);
  --accent-md: rgba(232,98,26,.25);
  --border:    rgba(232,98,26,.18);
  --border-s:  #262626;
  --sans:      'Barlow', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  /* Transparent unterhalb der Leistenzeilen: der aufklappende Zusatzbereich
     (Favoriten-Dropdown) muss die Seite darunter durchscheinen lassen. */
  background: transparent;
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  padding: 0 10px;
  height: 44px;
  background: var(--chrome-bg);
  border-bottom: 1px solid var(--border-s);
}
.logo-mark { display: flex; align-items: center; gap: 8px; user-select: none; margin-right: 10px; }
.logo-mark img { width: 22px; height: 22px; display: block; }
.logo-text .brand { font-size: 13px; font-weight: 800; letter-spacing: -.2px; color: var(--text); }
.logo-text .brand span { color: var(--accent); }
.tabstrip {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
  height: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabstrip::-webkit-scrollbar { display: none; }
.tab {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 200px;
  padding: 6px 12px;
  border-radius: 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s, background .15s;
}
.tab .label {
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 140px;
}
.tab:hover { background: var(--bg-hover); color: var(--text); }
.tab.active { color: var(--accent); background: var(--accent-lo); }
.tab .close {
  display: none;
  border: 0; background: none;
  color: var(--muted); font-size: 12px; cursor: pointer; padding: 0 2px;
}
.tab:hover .close { display: inline; }
.tab .close:hover { color: var(--text); }
#newtab {
  border: 0; background: none;
  color: var(--muted); font-size: 18px; cursor: pointer;
  padding: 2px 8px; border-radius: 6px;
}
#newtab:hover { color: var(--accent); background: var(--accent-lo); }
#gear {
  border: 0;
  background: none;
  color: var(--muted);
  cursor: pointer;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 6px;
  transition: color .15s, background .15s;
}
#gear svg { width: 17px; height: 17px; }
#gear:hover { color: var(--text); background: var(--bg-hover); }
.urlrow {
  position: fixed;
  top: 44px; left: 0; right: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 48px;
  padding: 0 12px;
  background: var(--chrome-bg);
  border-bottom: 1px solid var(--border-s);
}
.navbtns {
  display: flex;
  align-items: center;
  gap: 2px;
}
.navbtns button {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 9px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color .15s, background .15s;
}
.navbtns button svg { width: 19px; height: 19px; }
.navbtns button:hover { color: var(--text); background: var(--bg-hover); }
.navbtns button:active { transform: scale(.92); }
.urlwrap { position: relative; flex: 1; display: flex; }
#url {
  flex: 1;
  height: 36px;
  padding: 0 40px 0 16px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  outline: none;
}
#url:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-lo); }
/* Favoriten-Stern innen rechts im Adressfeld + Dropdown darunter */
#star {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border: 0; background: none; border-radius: 7px;
  color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: color .15s, background .15s;
}
#star svg { width: 17px; height: 17px; }
#star:hover { color: var(--accent); background: var(--bg-hover); }
#star.gespeichert { color: var(--accent); }
#star.gespeichert svg path { fill: currentColor; }
.favdrop {
  position: absolute; top: calc(100% + 8px); right: 0; width: 320px; max-height: 340px;
  overflow: auto; background: var(--bg-card); border: 1px solid var(--border-s);
  border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.35); padding: 6px; z-index: 40;
}
.favdrop[hidden] { display: none; }
.favdrop .zeile { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 8px; cursor: pointer; }
.favdrop .zeile:hover { background: var(--bg-hover); }
.favdrop .zeile .name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.favdrop .zeile .dom { font-size: 11px; color: var(--muted); flex: 0 0 auto; }
.favdrop .fuss { border-top: 1px solid var(--border-s); margin-top: 4px; padding: 7px 9px; font-size: 12px; color: var(--accent); cursor: pointer; border-radius: 8px; }
.favdrop .fuss:hover { background: var(--bg-hover); }
.favdrop .leer { padding: 10px 9px; font-size: 12px; color: var(--muted); }
/* Anzeige, solange ein Assistent über den lokalen Dienst verbunden sein kann */
.agent-badge {
  display: none; flex: 0 0 auto; align-items: center; gap: 6px;
  height: 22px; padding: 0 9px; border-radius: 999px;
  background: var(--accent-lo); color: var(--accent);
  border: 1px solid var(--border); font-size: 11px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; user-select: none;
}
.agent-badge.sichtbar { display: inline-flex; }
.agent-badge b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo-mark">
    <img src="logo-256.png" alt="" width="22" height="22">
    <div class="logo-text">
      <div class="brand">3DK <span>Browser</span></div>
    </div>
  </div>
  <div class="tabstrip" id="tabs"></div>
</div>
<div class="urlrow">
  <div class="navbtns">
    <button id="back" title="Zurück">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="fwd" title="Vor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button id="reload" title="Neu laden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 1 0-2.2 5.9"/><path d="M20 5v6h-6"/></svg>
    </button>
    <button id="home" title="Startseite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5.5h4V20"/></svg>
    </button>
  </div>
  <span id="agent-badge" class="agent-badge" title="Assistenten-Anbindung ist eingeschaltet">Agent <b id="agent-count">0</b></span>
  <div class="urlwrap">
    <input id="url" type="text" placeholder="Suchen oder Adresse eingeben" autocomplete="off" spellcheck="false">
    <button id="star" title="Als Favorit speichern">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.6l2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.6-5 2.6.9-5.6-4-3.9 5.6-.8z"/></svg>
    </button>
    <div id="favdrop" class="favdrop" hidden></div>
  </div>
  <button id="gear" title="Einstellungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
  </button>
</div>
<script src="js/chrome-bar.js"></script>
<script src="theme.js"></script>
</body>
</html>
